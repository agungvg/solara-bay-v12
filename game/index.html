<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — open-world crime on the Kumala Strand</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1530;
    font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* ---------- HUD ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; font-size: 14px; }
  .hud-mission { position: absolute; top: 14px; left: 14px; width: 400px;
    background: rgba(12,14,22,.82); border-left: 5px solid #ff7a33; border-radius: 6px; padding: 10px 12px; }
  .m-title { display: flex; gap: 8px; align-items: baseline; }
  .m-n { background: #ffb347; color: #111; font-weight: 900; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  .m-name { font-weight: 900; font-size: 17px; letter-spacing: .5px; }
  .m-timer { margin-left: auto; font-weight: 900; color: #ffb347; }
  .m-head { font-size: 19px; font-weight: 900; margin-top: 4px; }
  .m-brief { color: #ffd9b0; margin: 3px 0 7px; font-size: 13px; }
  .m-stage { display: flex; align-items: center; gap: 8px; }
  .m-stage-label { background: #ff7a33; color: #111; font-weight: 900; padding: 2px 7px; border-radius: 3px; font-size: 12px; }
  .m-stage-bar { flex: 1; height: 7px; background: rgba(255,255,255,.18); border-radius: 4px; overflow: hidden; }
  .m-stage-bar i { display: block; height: 100%; background: linear-gradient(90deg,#ffb347,#ff7a33); }
  .m-next { margin-top: 6px; color: #9fd4e8; font-size: 13px; }
  .m-next b { color: #fff; }
  .hud-police { position: absolute; top: 158px; left: 14px; width: 330px;
    background: rgba(12,14,22,.82); border-radius: 6px; padding: 9px 12px; }
  .p-head { display: flex; justify-content: space-between; font-weight: 900; font-size: 13px; color: #ffb347; margin-bottom: 5px; }
  .p-row { display: flex; gap: 7px; align-items: center; padding: 2px 0; font-size: 13px; }
  .p-dot { width: 9px; height: 9px; border-radius: 50%; background: #37c8e8; flex: none; }
  .p-dot.red { background: #ff3b30; } .p-dot.blue { background: #4a90ff; }
  .p-name { font-weight: 800; width: 86px; }
  .p-role { color: #ffb347; flex: 1; font-size: 12px; }
  .p-dist { color: #cfd8dc; }
  .p-more { color: #9aa5b1; font-size: 12px; margin-top: 4px; }
  .hud-left { position: absolute; left: 14px; bottom: 14px; width: 250px; }
  .hud-district { background: rgba(12,14,22,.82); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .d-name { font-weight: 900; font-size: 16px; color: #ffb347; }
  .d-sub { color: #cfd8dc; font-size: 12px; }
  .d-meter { height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .d-meter i { display: block; height: 100%; background: #2fae6e; }
  .d-meter-label { font-size: 11px; color: #9aa5b1; margin-top: 3px; }
  .hud-map { position: relative; width: 220px; height: 220px; border: 3px solid rgba(255,255,255,.85);
    border-radius: 50%; overflow: hidden; background: #123a4d; margin-bottom: 8px; }
  .hud-map canvas { width: 220px; height: 220px; display: block; }
  .hud-map-n { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-weight: 900; color: #fff; text-shadow: 0 1px 3px #000; }
  .hud-vitals .v-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; font-weight: 800; }
  .v-bar { flex: 1; height: 9px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; }
  .v-bar i { display: block; height: 100%; }
  .v-bar.health i { background: #37d67a; } .v-bar.armour i { background: #4a90ff; }
  .hud-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  .hud-clock { font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 1px 4px #000; }
  .hud-cash { font-size: 40px; font-weight: 900; color: #7dff9e; text-shadow: 0 2px 6px #000; line-height: 1; }
  .hud-wanted { font-size: 30px; color: #ffd21a; letter-spacing: 3px; text-shadow: 0 2px 6px #000; }
  .hud-wanted span { color: rgba(255,255,255,.35); }
  .hud-rank { margin-top: 4px; font-size: 13px; }
  .r-badge { background: #2fae6e; padding: 2px 7px; border-radius: 3px; font-weight: 900; }
  .r-bar { width: 170px; height: 7px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; margin: 4px 0 2px auto; }
  .r-bar i { display: block; height: 100%; background: #2fae6e; }
  .r-rp { color: #cfd8dc; font-size: 11px; }
  .hud-col { position: absolute; top: 178px; right: 16px; width: 250px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .hud-air { background: #ff3b30; color: #fff; font-weight: 900; font-size: 12px; padding: 4px 9px; border-radius: 4px; }
  .hud-weapons { display: flex; gap: 5px; }
  .w-slot { width: 56px; background: rgba(12,14,22,.82); border: 2px solid rgba(255,255,255,.25);
    border-radius: 6px; padding: 5px 4px; text-align: center; }
  .w-slot.active { border-color: #ffb347; background: rgba(60,40,10,.9); }
  .w-num { display: block; font-size: 11px; color: #ffb347; font-weight: 900; }
  .w-ico { display: block; font-size: 17px; }
  .w-name { display: block; font-size: 11px; font-weight: 800; }
  .w-ammo { display: block; font-size: 11px; color: #cfd8dc; }
  .hud-crew { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .c-card { display: flex; align-items: center; gap: 8px; background: rgba(12,14,22,.82);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  .c-key { background: #ffb347; color: #111; font-weight: 900; border-radius: 3px; padding: 2px 6px; }
  .c-ava { width: 30px; height: 30px; border-radius: 50%; background: #2fae6e; display: flex;
    align-items: center; justify-content: center; font-weight: 900; flex: none; }
  .c-ability { font-weight: 900; color: #ffb347; }
  .c-name { color: #cfd8dc; }
  .c-cd { margin-left: auto; color: #9aa5b1; }
  .hud-br { position: absolute; right: 16px; bottom: 14px; text-align: right; }
  .hud-speed { font-size: 58px; font-weight: 900; line-height: .9; text-shadow: 0 2px 8px #000; }
  .hud-speed span { font-size: 16px; color: #cfd8dc; }
  .hud-vehicle { font-size: 15px; font-weight: 900; color: #ffb347; text-shadow: 0 1px 4px #000; }
  .hud-vehicle span { color: #fff; font-weight: 700; margin-left: 6px; }
  .v-cond { width: 180px; height: 6px; background: rgba(0,0,0,.6); border-radius: 3px; overflow: hidden; margin: 4px 0 6px auto; }
  .v-cond i { display: block; height: 100%; background: #ff7a33; }
  .hud-radio { color: #7dff9e; font-size: 13px; text-shadow: 0 1px 4px #000; }
  .hud-dialogue { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: 480px; display: flex; gap: 10px; background: rgba(12,14,22,.88);
    border-radius: 8px; padding: 10px 12px; align-items: center; }
  .dlg-ava { width: 46px; height: 46px; border-radius: 8px; background: #3a7bd5; display: flex;
    align-items: center; justify-content: center; font-weight: 900; font-size: 18px; flex: none; }
  .dlg-name { font-weight: 900; color: #7dd8ff; font-size: 13px; }
  .dlg-text { font-size: 14px; margin-top: 2px; }
  .hud-insight { position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
    background: #ff3b30; font-weight: 900; padding: 4px 12px; border-radius: 4px; font-size: 14px; }
  .hud-chips { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; }
  .chip { background: rgba(12,14,22,.85); border: 1px solid #ffb347; color: #ffb347;
    font-weight: 800; font-size: 12px; padding: 3px 9px; border-radius: 12px; }
  #hint, #feed { position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    background: rgba(12,14,22,.9); padding: 6px 12px; border-radius: 5px; font-size: 13px;
    opacity: 0; transition: opacity .3s; }
  #hint { bottom: 168px; }
  /* ---------- Start screen ---------- */
  #start { position: fixed; inset: 0; background: linear-gradient(160deg, rgba(13,21,48,.88), rgba(123,47,190,.55));
    display: flex; align-items: center; justify-content: center; z-index: 5; }
  .start-card { text-align: center; max-width: 640px; padding: 30px; }
  .start-kicker { color: #ffb347; font-weight: 900; letter-spacing: 3px; font-size: 13px; }
  .start-card h1 { font-size: 84px; margin: 8px 0; letter-spacing: 4px;
    background: linear-gradient(180deg,#fff,#ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .start-tag { font-size: 17px; color: #e8ecf1; }
  .start-missions { color: #7dff9e; font-weight: 800; margin: 14px 0 22px; font-size: 14px; }
  #start-btn { font-size: 19px; font-weight: 900; padding: 14px 30px; border: none; border-radius: 8px;
    background: #ff7a33; color: #111; cursor: pointer; }
  #start-btn:hover { background: #ffb347; }
  .start-controls { margin-top: 18px; color: #cfd8dc; font-size: 13px; }
  /* ---------- Meta screen ---------- */
  .meta-screen { position: fixed; inset: 0; background: #0a0c14; z-index: 4;
    overflow: auto; padding: 18px 26px; box-sizing: border-box; }
  .meta-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
  .meta-title h1 { margin: 0; font-size: 34px; letter-spacing: 3px; }
  .meta-title span { color: #ffb347; font-size: 13px; font-weight: 800; }
  .meta-tabs { display: flex; gap: 16px; font-weight: 900; font-size: 14px; color: #9aa5b1; }
  .meta-tabs .active { color: #ffb347; border-bottom: 3px solid #ffb347; padding-bottom: 3px; }
  .meta-grid { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 18px; margin-top: 16px; }
  .meta-map-wrap { border: 2px solid #3a4356; border-radius: 8px; overflow: hidden; background: #123a4d; }
  .meta-map-wrap canvas { width: 100%; display: block; }
  .meta-map-legend { padding: 7px 10px; font-size: 12px; color: #ffb347; font-weight: 800; background: #14161f; }
  .meta-districts { margin-top: 10px; }
  .d-row { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 2px 0; }
  .d-row span { width: 130px; font-weight: 800; }
  .d-bar { flex: 1; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .d-bar i { display: block; height: 100%; background: #2fae6e; }
  .meta-ring-wrap { display: flex; gap: 16px; align-items: center; }
  .meta-ring { position: relative; width: 120px; height: 120px; flex: none; }
  .meta-ring svg { width: 120px; height: 120px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,.15); stroke-width: 11; }
  .ring-fg { fill: none; stroke: #ffb347; stroke-width: 11; stroke-linecap: round; }
  .ring-num { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .ring-num b { font-size: 22px; } .ring-num span { font-size: 10px; color: #9aa5b1; }
  .meta-rank { font-size: 15px; } .meta-rank b { display: block; font-size: 20px; }
  .meta-progress { margin-top: 14px; }
  .mp-row { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 0; }
  .mp-row span { width: 130px; }
  .mp-bar { flex: 1; height: 7px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .mp-bar i { display: block; height: 100%; background: #37c8e8; }
  .meta-stats-col h3, .meta-side-col h3 { font-size: 13px; color: #ffb347; margin: 14px 0 6px; letter-spacing: 1px; }
  .ratings-row { display: flex; gap: 6px; }
  .rating { width: 38px; height: 44px; background: #1c2333; border-radius: 5px; display: flex;
    flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; color: #ffd21a; }
  .rating small { font-size: 9px; color: #9aa5b1; }
  .rating.todo { color: #555; }
  .career-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .career-cell { background: #1c2333; border-radius: 5px; padding: 7px 9px; }
  .career-cell b { display: block; font-size: 16px; } .career-cell span { font-size: 11px; color: #9aa5b1; }
  .ws-car { font-weight: 900; font-size: 15px; } .ws-car span { color: #9aa5b1; font-weight: 400; font-size: 12px; }
  .ws-quote { color: #ffd9b0; font-style: italic; font-size: 13px; margin: 6px 0 8px; }
  .ws-row, .gear-row, .save-row { display: flex; gap: 8px; font-size: 12px; padding: 3px 0; align-items: center; }
  .ws-row span, .gear-row span, .save-row span { flex: 1; }
  .ws-state { font-weight: 900; color: #ff5a5a; } .ws-state.owned { color: #37d67a; }
  .ws-back { margin-top: 8px; color: #ffb347; font-weight: 900; font-size: 13px; }
  .meta-workshop, .meta-gear, .meta-saves { background: #14161f; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .meta-workshop h3, .meta-gear h3, .meta-saves h3 { margin-top: 0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay: open-world crime game"></canvas>
<div id="hud"></div>
<div id="meta"></div>
<div id="hint"></div>
<div id="feed"></div>
<div id="start"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
